<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subotto Slideshow</title>
  <link rel="stylesheet" href="/slideshow/static/slideshow.css">
</head>
<body>
  <!-- OBS Browser Source: transparent page, dual-layer slides, credit in a corner. -->
  <div id="stage">
    <img id="slide-a" class="slide-layer is-active" alt="" hidden>
    <img id="slide-b" class="slide-layer" alt="" hidden>
    <!-- Floater playground — full viewport in animated mode (fountain from center). -->
    <div id="floater-stage" class="floater-stage" aria-hidden="true"></div>
    <div id="credit" class="credit br" hidden style="--credit-scale: 1.5; --reaction-scale: 1.5;">
      <div class="credit-card">
        <div class="credit-row">
          <div id="credit-name" class="credit-name"></div>
          <div id="credit-reactions" class="credit-reactions" hidden></div>
        </div>
        <!-- Discord message sits under the author row in the same card. -->
        <div id="comment" class="comment-text" hidden></div>
      </div>
    </div>
    <!-- Opposite corner: muted X/Y + ring that fills until the next slide. -->
    <div id="progress" class="progress tr" hidden style="--credit-scale: 1.5; --progress-ms: 8000ms;">
      <span id="progress-count"></span>
      <svg class="progress-ring" viewBox="0 0 36 36" aria-hidden="true">
        <g transform="rotate(-90 18 18)">
          <circle class="progress-ring-bg" cx="18" cy="18" r="16" fill="none"></circle>
          <circle id="progress-fg" class="progress-ring-fg" cx="18" cy="18" r="16" fill="none"></circle>
        </g>
      </svg>
    </div>
    <div id="empty" class="empty" hidden>waiting for pictures…</div>
  </div>
  <script src="/slideshow/static/slideshow.js"></script>
</body>
</html>
